<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment Test - ERP System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .test-badge {
            background: #ff9800;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .response h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .response pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .info-box h4 {
            color: #1976d2;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .info-box p {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Razorpay Payment Test</h1>
            <p>ERP System - Fee Payment Gateway</p>
            <span class="test-badge">TEST MODE</span>
        </div>

        <div class="info-box">
            <h4>📌 Test Instructions</h4>
            <p>1. Enter any amount in rupees<br>
               2. Click "Pay Now" button<br>
               3. Use Razorpay test cards for payment<br>
               4. Payment response will appear below</p>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount" placeholder="Enter amount in rupees" min="1" required>
            </div>

            <div class="form-group">
                <label for="student_id">Student ID (Optional)</label>
                <input type="text" id="student_id" name="student_id" placeholder="e.g., 101">
            </div>

            <div class="form-group">
                <label for="payment_for">Payment For (Optional)</label>
                <input type="text" id="payment_for" name="payment_for" placeholder="e.g., Annual Fee">
            </div>

            <button type="submit" class="btn" id="payBtn">
                Pay Now
            </button>
        </form>

        <div id="response" class="response"></div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:5000/api/accountant';

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const amount = document.getElementById('amount').value;
            const student_id = document.getElementById('student_id').value;
            const payment_for = document.getElementById('payment_for').value;
            const payBtn = document.getElementById('payBtn');
            const responseDiv = document.getElementById('response');

            if (!amount || amount <= 0) {
                showResponse('error', 'Please enter a valid amount');
                return;
            }

            // Disable button and show loading
            payBtn.disabled = true;
            payBtn.innerHTML = 'Creating Order<span class="loader"></span>';
            responseDiv.style.display = 'none';

            try {
                // Step 1: Create Razorpay Order
                const orderResponse = await fetch(`${API_BASE_URL}/payment/create-order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        student_id,
                        payment_for: payment_for || 'Fee Payment',
                        academic_year: '2024-2025'
                    })
                });

                const orderData = await orderResponse.json();

                if (!orderData.success) {
                    throw new Error(orderData.message || 'Failed to create order');
                }

                // Step 2: Open Razorpay Checkout
                const options = {
                    key: orderData.data.key_id,
                    amount: orderData.data.amount,
                    currency: orderData.data.currency,
                    name: 'ERP System',
                    description: payment_for || 'Fee Payment',
                    order_id: orderData.data.order_id,
                    handler: async function (response) {
                        // Step 3: Verify Payment
                        await verifyPayment(response);
                    },
                    prefill: {
                        name: 'Test User',
                        email: 'test@example.com',
                        contact: '9999999999'
                    },
                    theme: {
                        color: '#667eea'
                    },
                    modal: {
                        ondismiss: function() {
                            payBtn.disabled = false;
                            payBtn.innerHTML = 'Pay Now';
                            showResponse('error', 'Payment cancelled by user');
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();

            } catch (error) {
                console.error('Error:', error);
                showResponse('error', error.message);
                payBtn.disabled = false;
                payBtn.innerHTML = 'Pay Now';
            }
        });

        async function verifyPayment(response) {
            const payBtn = document.getElementById('payBtn');
            payBtn.innerHTML = 'Verifying Payment<span class="loader"></span>';

            try {
                const verifyResponse = await fetch(`${API_BASE_URL}/payment/verify-payment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    })
                });

                const verifyData = await verifyResponse.json();

                if (verifyData.success) {
                    showResponse('success', 'Payment Successful!', verifyData.data);
                } else {
                    showResponse('error', 'Payment Verification Failed', verifyData);
                }

            } catch (error) {
                console.error('Verification Error:', error);
                showResponse('error', error.message);
            } finally {
                payBtn.disabled = false;
                payBtn.innerHTML = 'Pay Now';
            }
        }

        function showResponse(type, message, data = null) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = `response ${type}`;
            
            let html = `<h3>${message}</h3>`;
            if (data) {
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            responseDiv.innerHTML = html;
            responseDiv.style.display = 'block';
        }
    </script>
</body>
</html>
